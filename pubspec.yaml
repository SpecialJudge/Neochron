name: celechron
description: Neochron —— Celechron 的非官方改版：四种时间语义、子待办行程表、专注计时与统计、AI 整理。
publish_to: "none"
version: 1.4.2-elychron.1+10
environment:
  sdk: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get:
  cupertino_icons:
  table_calendar:
  hive:
  hive_flutter:
  uuid:
  flutter_svg:
  intl:
  extended_sliver:
  flutter_launcher_icons:
  rename_app:
  url_launcher:
  quiver: ^3.2.1
  workmanager:
    git:
      url: https://github.com/Celechron/flutter_workmanager.git
      ref: main
      path: workmanager
  flutter_local_notifications: ^17.2.4
  flutter_secure_storage: ^9.2.4
  qr_flutter:
  app_links:
  crypto: 
  path_provider:
  share_plus: ^12.0.1 # 9fb0fb 提交当中提升了版本
  device_calendar:
  timezone:
  device_info_plus:
  file_picker: ^8.0.0
  local_notifier: ^0.1.6
  desktop_drop: ^0.8.4
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  pigeon: any

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    # 显式列出教程图片目录（2026-09-17）：
    # 只写 `- assets/` 时，Flutter 打**测试**用的资产包没有把后来新建的子目录收进去
    # （app 包里是好的），于是 test/tutorial_test.dart 里那条"图片真的能读出来"的用例
    # 会误报。显式列一遍最稳，也让"教程要放图"这件事在 pubspec 里看得见。
    - assets/tutorial/
    - assets/tutorial/tasks/
    - assets/tutorial/data/
    - assets/tutorial/setup/
    - assets/tutorial/basics/
    - assets/tutorial/course/
    - assets/tutorial/focus/
    # 随包内置的校历（用户 2026-09-17 拍板）：上游那个第三方站老是连不上，
    # 索性把公开的校历 JSON 打进包里；之后**每周**才去试一次远程更新、比差异取新的。
    - assets/calendar/
    # 桌面端提醒音（见 lib/platform/desktop_notify.dart）：
    # 整个目录一起声明 —— 想换成人声直接把音频丢进来即可，不用改代码。
    #   优先找 ely_hi.mp3 / ely_hi.m4a / ely_hi.wav / voice.mp3 / voice.wav
    #   都没有就用内置的 ding.wav（自己合成的，无版权问题）
    - assets/sounds/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# ===== 应用图标（2026-09-25 换成新美术；本轮**只出 Android**）=====
# 母版放 tools/app-icon/：**故意不放 assets/** —— assets 下任何文件都会被打进 APK，
# 而这张 1024 母版只在构建时用一次（关于页那张是另存的 512 版本）。
# ⚠️ 这个目录**不能**叫 tools/icon：.gitignore 里有一条从 macOS 模板抄来的裸规则
#   `Icon`（L242 与 L658 各一条，本意是忽略 macOS 那个名字带 \r 的卷图标文件），
#   本机 core.ignorecase=true 会把它当成 `icon` 匹配掉整个目录 —— 母版静默不入库，
#   而 pubspec 却指着它（2026-09-25 实测踩到，故改名 app-icon）。
# 自适应图标：**白底 + 前景缩进 16%**（前景 = 母版本身，外面一圈由白底补上）。
#   白底是为了跟美术自己的底色无缝衔接（#FFFFFF 占该图 95%）。
#   ⚠️ 别再改回「满铺」（背景=母版、前景=透明占位、inset 0）：2026-09-25 试过一版，
#   理由是实测该美术的墨迹内接于画布内切圆、圆形遮罩裁不到内容 —— 但那只对
#   **恰好铺满 108dp 的标准圆形遮罩**成立。真机上不少启动器（华为/鸿蒙那类）
#   画出来的形状只占图层约 82%，于是零安全边距的满铺直接吃掉了图案本体
#   （该美术左右白边只有 1.8%/2.3%、墨迹宽占 96%，每边被切约 8.5%）。
#   用户真机反馈「过于饱满、原图边缘看不到了」，故改回标准做法。
# 传统图标（mipmap-*/ic_launcher.png）仍由 image_path 整图缩放生成。
# ⚠️ 资源名必须保持 ic_launcher：通知小图标在 4 处代码里写死了 @mipmap/ic_launcher
#   （main.dart / task_reminder.dart / option_controller.dart / background_app_refresh.dart）。
# ⚠️ ios: false 是**本轮有意关掉**：iOS 与 macOS 那两套至今仍是上游旧美术
#   （iOS icon.png 的 blob 自上游 94fca84 起没变过），换代要连 Contents.json
#   与 macos 那 7 张一起处理，单开一轮，见 docs/BACKLOG.md。
#   remove_alpha_ios 留着不删：等做 iOS 那轮还要用。
flutter_launcher_icons:
  image_path: tools/app-icon/app_icon.png
  android: true
  ios: false
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: tools/app-icon/app_icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
