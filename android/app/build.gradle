plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ===== 正式签名配置 =====
// android/key.properties（已 gitignore）里放 keystore 路径与密码：
//   storePassword=...  keyPassword=...  keyAlias=elychron
//   storeFile=D:/keys/elychron-release.jks
// 文件不存在时自动退回 debug 签名，这样没配签名的人也能正常构建。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace 'xyz.nosig.celechron'
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true
        // ===== 2026-09-25 换成本项目自己的包名 =====
        //
        // 原来是 `xyz.nosig.celechron.mod`（上一代 Elychron 用的那一个），后果有三个：
        //   1. 系统把 Neochron 与 Elychron 当成**同一个应用**，安装时显示"更新"、两者不能共存；
        //   2. 从 Elychron 迁过来时覆盖安装会被签名差异拒掉（INSTALL_FAILED_UPDATE_INCOMPATIBLE）；
        //   3. 已装版本的 versionCode 更大时，装旧版会被拒（INSTALL_FAILED_VERSION_DOWNGRADE）。
        // 换成自己的包名后这三点一起消失（代价：手机上要做一次"导出→卸载→装→导入"）。
        //
        // ⚠️ 注意：**不要**顺手把上面的 `namespace 'xyz.nosig.celechron'` 一起改掉 ——
        // manifest 里的小组件/接收器用的是相对名（`.MainActivity`、`.TodoWidgetReceiver`），
        // 它们按 namespace 解析；namespace 与 applicationId 本来就允许不同。
        applicationId "io.github.specialjudge.neochron"
        minSdkVersion 28
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // 有 key.properties 就用正式签名；没有则退回 debug。
            //
            // 开发期装机自测的用法：把 android/key.properties 临时改名（例如加 .off 后缀）
            // 再构建，就会得到 debug 签名的包 —— 它和手机上现装的 debug 版同签名，
            // 能直接覆盖安装而不动数据。正式签名启用后这一步很重要，否则测试只能
            // 「卸载重装 = 丢数据」。**发布时别忘了改回来**（构建脚本里有核对提示）。
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.window:window-java:1.3.0'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation "androidx.glance:glance:1.1.1"
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    // For flutter_secure_storage
    implementation 'com.google.errorprone:error_prone_annotations:2.36.0'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // For preview
    implementation 'androidx.glance:glance-appwidget-preview:1.1.1'
    implementation "androidx.glance:glance-preview:1.1.1"
}
